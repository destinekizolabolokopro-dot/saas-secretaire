<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace pro — Ally</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<a class="skip-link" href="#tabpanel">Aller au contenu</a>

<div class="shell" id="shell">
  <div class="scrim" id="scrim"></div>

  <aside class="sidebar" id="sidebar">
    <button class="sidebar-close" id="sidebar-close" type="button" aria-label="Fermer le menu">×</button>

    <div class="sidebar-head">
      <span class="logo-mark" aria-hidden="true"></span>
      <span class="logo-word">Ally</span>
      <span class="badge-pro" id="badge-plan">Pro</span>
    </div>

    <nav class="nav-list" id="nav-list" aria-label="Sections de l'espace pro"></nav>

    <button class="profile-card" id="profile-card" type="button">
      <span class="avatar" id="avatar" aria-hidden="true"></span>
      <span class="profile-text">
        <strong id="profile-name">—</strong>
        <span id="profile-org">—</span>
      </span>
      <span class="profile-chevron" aria-hidden="true">›</span>
    </button>

    <div class="sidebar-foot">
      <p class="foot-account">
        <span id="foot-email">—</span>
        <button type="button" class="btn-link" id="foot-logout">Déconnexion</button>
      </p>

      <div class="foot-switch">
        <span id="lbl-foot-transfer">Transfert auto des urgences</span>
        <button type="button" class="toggle toggle-sm" role="switch" id="foot-transfer"
                aria-labelledby="lbl-foot-transfer"></button>
      </div>
      <div class="foot-switch">
        <span id="lbl-foot-digest">Résumé quotidien par email</span>
        <button type="button" class="toggle toggle-sm" role="switch" id="foot-digest"
                aria-labelledby="lbl-foot-digest"></button>
      </div>

      <ul class="foot-links">
        <li><span class="foot-dim">Stockage :</span> <span id="foot-storage">navigateur</span></li>
        <li><button type="button" class="foot-link" id="foot-palette">⌘K — Palette de commandes</button></li>
        <li><a class="foot-link" href="index.html">← Retour au site public</a></li>
        <li id="foot-admin-item" hidden><a class="foot-link" href="admin.html">Console d'administration →</a></li>
        <li><button type="button" class="foot-link" id="foot-invite">Inviter un collaborateur (lecture seule)</button></li>
        <li><button type="button" class="foot-link" id="foot-voice">Voix : <span id="foot-voice-name">par défaut</span> (modifier)</button></li>
      </ul>
      <p class="foot-version">Ally — v0.7</p>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-id">
        <h1 id="tab-title">Aujourd'hui</h1>
        <p class="topbar-sub" id="tab-sub"></p>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
      <div class="topbar-tools">
        <button class="icon-btn search-toggle" id="search-toggle" type="button" aria-label="Rechercher" aria-expanded="false">
          <span class="glyph-mag" aria-hidden="true"></span>
        </button>
        <button class="icon-btn" id="menu-toggle" type="button" aria-label="Ouvrir le menu" aria-controls="sidebar" aria-expanded="false" hidden>
          <span class="glyph-sq" aria-hidden="true"></span>
        </button>
        <div class="search-wrap">
          <label class="sr-only" for="search">Rechercher un appel, un email, un rendez-vous</label>
          <input class="search" id="search" type="search" placeholder="Rechercher..." autocomplete="off">
          <div class="search-results" id="search-results" role="listbox" hidden></div>
        </div>
        <div class="notif-wrap">
          <button class="icon-btn" id="notif-btn" type="button" aria-label="Notifications" aria-haspopup="true">
            <span class="glyph-sq" aria-hidden="true"></span>
            <span class="badge" id="notif-badge" aria-hidden="true"></span>
          </button>
          <div class="notif-panel" id="notif-panel" hidden></div>
        </div>
      </div>
    </div>

    <div id="tabpanel" role="region" aria-live="polite" aria-labelledby="tab-title"></div>
  </main>
</div>

<button class="voice-fab" id="voice-fab" type="button" aria-haspopup="dialog">
  <span class="mic" aria-hidden="true"></span>
  <span>Parler à Ally</span>
</button>

<div class="palette-overlay" id="palette-overlay" role="dialog" aria-modal="true"
     aria-label="Palette de commandes" hidden>
  <div class="palette">
    <label class="sr-only" for="palette-input">Rechercher une commande</label>
    <input class="palette-input" id="palette-input" type="text"
           placeholder="Aller à, exécuter, ou demander à Ally…" autocomplete="off">
    <div class="palette-list" id="palette-list" role="listbox"></div>
    <p class="palette-hint">↑↓ pour naviguer · Entrée pour valider · Échap pour fermer</p>
  </div>
</div>

<div class="voice-overlay" id="voice-overlay" role="dialog" aria-modal="true" aria-labelledby="voice-title" hidden>
  <div class="voice-panel">
    <div class="voice-viz" id="voice-viz" aria-hidden="true">
      <span class="ring"></span><span class="ring"></span><span class="ring"></span>
      <span class="core"></span>
    </div>

    <h2 id="voice-title">Ally écoute…</h2>
    <p class="voice-heard" id="voice-heard" role="status"></p>
    <p class="voice-detail" id="voice-detail" hidden></p>
    <p class="voice-confirm" id="voice-confirm" hidden></p>

    <form class="voice-form" id="voice-form">
      <label class="sr-only" for="voice-input">Écrire votre demande à Ally</label>
      <input class="field" id="voice-input" type="text" placeholder="Écrivez votre demande…" autocomplete="off">
      <button class="btn btn-primary btn-md" type="submit">Demander</button>
    </form>

    <div class="voice-suggestions" id="voice-suggestions"></div>

    <div class="voice-actions">
      <button class="btn btn-primary btn-md" id="voice-ok" type="button" hidden>Confirmer</button>
      <button class="btn btn-ghost btn-md" id="voice-again" type="button" hidden>Reparler</button>
      <button class="btn btn-ghost btn-md" id="voice-cancel" type="button">Fermer</button>
    </div>

    <p class="voice-unwired" id="voice-note"></p>
  </div>
</div>

<script src="js/profiles.js"></script>
<script src="js/plans.js"></script>
<script src="js/accounts.js"></script>
<script src="js/api.js"></script>
<script src="js/gate.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/voice.js"></script>
<script src="js/agenda.js"></script>
<script src="js/brain.js"></script>
<script src="js/converse.js"></script>
<script src="js/live.js"></script>
<script src="js/mailbox.js"></script>
<script src="js/telephony.js"></script>
<script src="js/palette.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
